<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-labelledby="t d">
<title id="t">SeemaDrishti 3D architecture</title>
<desc id="d">Exploded isometric view of four layers: officer UI, Worker API, checks engine, and Cloudflare D1 plus R2 storage.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1a"/><stop offset="1" stop-color="#150f3a"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/></pattern>
  <style>
    @keyframes floaty { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
    @keyframes dash { to { stroke-dashoffset: -20; } }
    .l1 { animation: floaty 4.6s ease-in-out infinite; }
    .l2 { animation: floaty 4.6s ease-in-out infinite .5s; }
    .l3 { animation: floaty 4.6s ease-in-out infinite 1s; }
    .flow { stroke-dasharray: 6 4; animation: dash 1.2s linear infinite; }
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  </style>
</defs>
<rect width="1100" height="640" rx="18" fill="url(#bg)"/>
<rect width="1100" height="640" rx="18" fill="url(#grid)"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#ffffff">System architecture</text>
<text x="40" y="78" font-size="15" fill="#a5b4fc">Exploded 3D view · one Cloudflare Worker, D1 for records, R2 for files</text>

<g class="l3"><polygon points="220.9,520.0 270.2,548.5 270.2,533.5 220.9,505.0" fill="#25b283" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><polygon points="379.4,485.5 270.2,548.5 270.2,533.5 379.4,470.5" fill="#0f7a5a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><polygon points="330.0,442.0 379.4,470.5 270.2,533.5 220.9,505.0" fill="#6ee7b7" stroke="rgba(255,255,255,0.10)" stroke-width="1"/></g>
