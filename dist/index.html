<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="SeemaDrishti document screening workspace. A fictional interface prototype."><title>SeemaDrishti | Screening workspace</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%231966e8' d='M16 2 29 7v10c0 7-13 13-13 13S3 24 3 17V7z'/%3E%3Cpath fill='white' d='m9 16 5 5 10-11-10 7z'/%3E%3C/svg%3E"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="readability.css"><link rel="stylesheet" href="workflow.css"></head>
<body><div id="root"><div class="loading-state">Opening SeemaDrishti…</div></div><div class="toast" id="toast" role="status" hidden></div><dialog id="camera-dialog" class="camera-dialog"><div class="camera-heading-row"><h2 id="camera-heading">Capture document</h2><button id="camera-close" aria-label="Close camera">×</button></div><label for="camera-device">Camera / capture device</label><select id="camera-device" class="select"><option>Connecting camera…</option></select><div class="camera-stage"><video id="camera-video" autoplay muted playsinline></video><img id="camera-photo" alt="Captured image preview" hidden></div><p id="camera-error" class="form-error" role="alert"></p><p class="fineprint">Review the image before saving. Closing this window stops the camera.</p><div class="camera-controls"><button class="button secondary" id="camera-retry">Reconnect camera</button><button class="button secondary" id="take-photo" disabled>Take photo</button><button class="button" id="save-capture" disabled>Save capture</button></div></dialog><script src="workspace.js"></script></body></html>
